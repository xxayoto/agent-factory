# Какой бэкенд выполняет каждую роль в режиме live. Ключи — только из окружения или ~/.config.
live:
  frame: runninghub_seedream      # factory/backends/runninghub.py, проверенный путь из job_search/workflows/rh_seedream.py
  video: runninghub_h3            # M2: перенос rh_h3.py
  judge: manual                   # M2: vision-LLM судья; до этого — человек в терминале
wavespeed:
  frame_model: null               # id модели WaveSpeed указать вручную (list_models), не угадывать
