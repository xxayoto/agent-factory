# Какой бэкенд выполняет каждую роль в режиме live. Ключи — только из окружения или ~/.config.
live:
  frame: wavespeed                # Seedream 5.0 Pro Edit; runninghub_seedream — запасной (кошелёк RH пуст на 31.10)
  video: wavespeed                # Hailuo 2.3 i2v; runninghub_h3 — когда пополнен кошелёк RH
  judge: claude                   # Claude Sonnet через claude -p; manual — человек в терминале
wavespeed:
  frame_model: bytedance/seedream-v5.0-pro/edit   # из list_models, $0.043–0.048 за кадр 1k
  resolution: 1k
  video_model: minimax/hailuo-2.3/i2v-standard   # $0.28 за 6 с 768p (get_price 01.11.2026)
  video_durations: [6, 10]
runninghub:
  h3_api_json: null               # локальный путь к API-JSON воркфлоу — в config/local.yaml (в .gitignore)
